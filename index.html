</style></head><body><div id="intro"><section><h1>Family Life 3D</h1><p>가족 생활 시뮬레이션 · v0.5<br>왼쪽 조이스틱으로 이동하고 오른쪽 화면을 드래그해 둘러보세요.<br>거울 · 옷 행거 · 침대 · 화장실 · 식탁</p><button id="start">게임 시작</button></section></div><div id="error"><section><h2>3D 화면을 불러오지 못했어요</h2><p>이 버전은 인터넷 연결과 Safari의 WebGL 지원이 필요해요. GitHub Pages 같은 웹 주소에서 실행해 주세요.</p><button onclick="location.reload()">다시 시도</button></section></div><div id="hud"><span id="stats"></span></div><div id="hint"></div><div id="toast"></div><div id="joy"><div id="nub"></div></div><div id="buttons"><button id="look">아래 보기</button><button id="use">상호작용</button><button id="stand" style="display:none">일어나기</button></div><div id="dialog"><div id="sheet"><h2 id="title"></h2><div id="choices"></div><p><button id="close">닫기</button></p></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>
(function(){

.36);$('stats').textContent=`임신 ${week}주 · ${weight.toFixed(1)}kg · ${clothes[outfit][0]}`;near=null;if(!lying){let d=2;for(let item of targets){let v=Math.hypot(camera.position.x-item.pos.x,camera.position.z-item.pos.z);if(v<d){near=item;d=v}}}$('use').textContent=near?near.name+' 사용':'가까이 이동';$('hint').textContent=near?near.name+'에 가까워졌어요':'집 안을 자유롭게 둘러보세요'}renderer.render(scene,camera)}function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',2600)}function dialog(title,opts){$('title').textContent=title;$('choices').replaceChildren();opts.forEach(([s,fn])=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>{fn();$('dialog').style.display='none'};$('choices').appendChild(b)});$('dialog').style.display='flex'}$('close').onclick=()=>$('dialog').style.display='none';$('start').onclick=()=>{try{if(!renderer)init();started=true;$('intro').style.display='none';$('hud').style.display='block';$('joy').style.display='block';$('buttons').style.display='flex';$('hint').style.display='block'}catch(e){$('error').style.display='flex';console.error(e)}};$('look').onclick=()=>{if(lying){toast('누운 상태에서 배가 보여요');return}pitch=pitch>.35?0:.85;toast(pitch?'아래를 바라봐요':'정면을 바라봐요')};$('stand').onclick=()=>{lying=false;$('stand').style.display='none';camera.position.set(-3.7,1.63,-2.2);pitch=0;toast('일어났어요')};$('use').onclick=()=>{if(!near){toast('물건 가까이 이동해 주세요');return}switch(near.kind){case 'bed':lying=true;$('stand').style.display='block';toast('침대에 누웠어요. 배가 살짝 움직여요.');break;case 'mirror':dialog('거울에 비친 내 모습',[['내 모습 확인',()=>toast('현재 옷과 임신한 배를 확인했어요')],['임신 주수 +1',()=>{week=Math.min(40,week+1);weight+=.2;toast('임신 '+week+'주')}]]);break;case 'hanger':dialog('옷 갈아입기',clothes.map((v,i)=>[v[0],()=>{outfit=i;applyOutfit();toast(v[0]+'으로 갈아입었어요')} ]));break;case 'scale':toast('몸무게 '+weight.toFixed(1)+'kg');break;case 'toilet':dialog('화장실',[['입덧으로 구토하기',()=>toast('속이 좋지
