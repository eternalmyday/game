<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Family Life 모바일</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151e;color:white;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh}button{border:0;border-radius:13px;padding:12px 15px;background:#f4d6dd;color:#2d2830;font-weight:700;font-size:14px;touch-action:manipulation}#intro{position:absolute;inset:0;background:linear-gradient(150deg,#262d42,#68566c);display:flex;align-items:center;justify-content:center;z-index:9}#intro .panel{max-width:330px;padding:30px;text-align:center}#intro h1{font-size:31px}#intro p{line-height:1.8;color:#f4e8ed}#hud{position:absolute;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:none;pointer-events:none}#hud span{background:#1c2337c9;padding:9px;border-radius:12px;font-size:13px}#actions{position:absolute;right:14px;bottom:calc(20px + env(safe-area-inset-bottom));display:none;gap:8px;flex-direction:column;align-items:end}#move{position:absolute;left:22px;bottom:calc(40px + env(safe-area-inset-bottom));width:115px;height:115px;border:2px solid #ffffff66;border-radius:50%;display:none;touch-action:none;background:#ffffff16}#knob{position:absolute;left:37px;top:37px;width:38px;height:38px;border-radius:50%;background:#ffffffa0}#modal{display:none;position:absolute;inset:0;background:#0008;z-index:5;align-items:center;justify-content:center}#sheet{background:#252a3b;border:1px solid #ffffff33;border-radius:22px;padding:22px;width:min(90vw,390px);max-height:75vh;overflow:auto}#sheet h2{margin-top:0}#sheet button{margin:4px}#toast{position:absolute;top:75px;left:50%;transform:translateX(-50%);background:#232838e8;padding:10px 15px;border-radius:12px;display:none;white-space:nowrap}
</style></head><body><canvas id="c"></canvas><div id="intro"><div class="panel"><h1>Family Life</h1><p>1인칭 가족 생활 시뮬레이션<br>왼쪽 원으로 이동 · 오른쪽 드래그로 시선 조절<br>침대 · 거울 · 옷 행거 · 체중계 · 식탁</p><button id="start">게임 시작</button></div></div><div id="hud"><span id="status">임신 24주 · 58.4kg</span></div><div id="toast"></div><div id="move"><div id="knob"></div></div><div id="actions"><button id="look">아래 보기</button><button id="interact">상호작용</button><button id="rest" style="display:none">일어나기</button></div><div id="modal"><div id="sheet"><h2 id="mt"></h2><div id="mb"></div><button id="close">닫기</button></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('c'),ctx=canvas.getContext('2d');let W=0,H=0,started=false,x=0,z=0,yaw=0,pitch=0,lying=false,week=24,weight=58.4,outfit=0,last=0,kick=0,joy={x:0,y:0},pointer=null,moveId=null,near=null;const colors=['#d994a5','#eee4ce','#829dc5','#a89abc','#8fb6a6','#34394b'],names=['핑크 홈웨어','아이보리 원피스','블루 니트','라벤더 원피스','민트 홈웨어','검정 외출복'];const objects=[{name:'침대',x:-3.2,z:-3.5,type:'bed'},{name:'거울',x:-4.6,z:-1.2,type:'mirror'},{name:'옷 행거',x:-4.6,z:0.5,type:'hanger'},{name:'체중계',x:3.5,z:-3.5,type:'scale'},{name:'변기',x:4.6,z:-3.3,type:'toilet'},{name:'식탁',x:2.8,z:2.2,type:'food'},{name:'배우자',x:-0.6,z:2.4,type:'person'}];function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();function polygon(pts,color){ctx.fillStyle=color;ctx.beginPath();pts.forEach(([a,b],i)=>i?ctx.lineTo(a,b):ctx.moveTo(a,b));ctx.closePath();ctx.fill()}function rect(a,b,w,h,c){ctx.fillStyle=c;ctx.fillRect(a,b,w,h)}function oval(a,b,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(a,b,Math.max(1,rx),Math.max(1,ry),0,0,Math.PI*2);ctx.fill()}function label(t,a,b){ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText(t,a,b)}function project(px,pz,alt=0){let dx=px-x,dz=pz-z,depth=dx*Math.sin(yaw)-dz*Math.cos(yaw),side=dx*Math.cos(yaw)+dz*Math.sin(yaw);if(depth<.15)return null;let f=Math.min(W,H)*.95;return {sx:W/2+side/depth*f,sy:H*.52+(pitch-alt/depth)*f,d:depth,scale:f/depth}}function figure(cx,feet,s,color){oval(cx,feet-s*1.42,s*.23,s*.26,'#e6bca8');rect(cx-s*.36,feet-s*1.18,s*.72,s*.73,color);rect(cx-s*.31,feet-s*.45,s*.25,s*.45,'#454c60');rect(cx+s*.07,feet-s*.45,s*.25,s*.45,'#454c60');oval(cx,feet-s*.73,s*.43,s*.35,color)}function room(){rect(0,0,W,H,'#d6d1cc');let horizon=H*.53+pitch*Math.min(W,H)*.95;polygon([[0,horizon],[W,horizon],[W,H],[0,H]],'#a98f7b');for(let i=-8;i<=8;i++){let a=project(i,-6),b=project(i,6);if(a&&b){ctx.strokeStyle='#ffffff26';ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.stroke()}}for(let i=-6;i<=6;i++){let a=project(-7,i),b=project(7,i);if(a&&b){ctx.strokeStyle='#ffffff26';ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.stroke()}}const walls=[[-6,-5,6,-5,'#ded8d1'],[-6,5,6,5,'#cbc7c1'],[-6,-5,-6,5,'#d8d4ce'],[6,-5,6,5,'#d0ccc6']];walls.forEach(([ax,az,bx,bz,c])=>{let a=project(ax,az),b=project(bx,bz);if(a&&b)polygon([[a.sx,a.sy],[b.sx,b.sy],[b.sx,b.sy-b.scale*2.5],[a.sx,a.sy-a.scale*2.5]],c)});objects.map(o=>({...o,p:project(o.x,o.z)})).filter(o=>o.p).sort((a,b)=>b.p.d-a.p.d).forEach(o=>{let {sx,sy,scale:s}=o.p;s=Math.min(s,800);if(o.type==='person'){figure(sx,sy,s*.8,'#6d829b')}else if(o.type==='mirror'){rect(sx-s*.55,sy-s*2,s*1.1,s*1.95,'#886e59');rect(sx-s*.48,sy-s*1.92,s*.96,s*1.79,'#b4d4d7');figure(sx,sy-s*.1,s*.7,colors[outfit])}else if(o.type==='bed'){rect(sx-s*1.1,sy-s*.55,s*2.2,s*.65,'#e9d6d4');rect(sx-s*.85,sy-s*.7,s*.7,s*.27,'#fff7f0')}else if(o.type==='hanger'){rect(sx-s*.8,sy-s*1.9,s*1.6,s*.1,'#6d5144');colors.slice(0,5).forEach((c,i)=>polygon([[sx+(i-2)*s*.26,sy-s*1.68],[sx+(i-2)*s*.26-s*.16,sy-s*1.25],[sx+(i-2)*s*.26+s*.16,sy-s*1.25]],c))}else if(o.type==='scale'){rect(sx-s*.45,sy-s*.16,s*.9,s*.16,'#b8c7c9')}else if(o.type==='toilet'){oval(sx,sy-s*.3,s*.5,s*.32,'#f9f8f6');rect(sx-s*.42,sy-s*.95,s*.84,s*.45,'#f9f8f6')}else{oval(sx,sy-s*.65,s*.8,s*.3,'#a77957');rect(sx-s*.12,sy-s*.65,s*.24,s*.65,'#785b4a')}if(o.p.d<3.8)label(o.name,sx,sy-s*2.1)})}function body(){if(lying){rect(0,0,W,H,'#b5a5a1');polygon([[0,H*.15],[W,H*.15],[W,H],[0,H]],'#e4d0ce');oval(W/2,H*.63,W*.33,H*.25,colors[outfit]);oval(W/2,H*.62,W*.26,H*.21,colors[outfit]);if(kick>0)oval(W*.57,H*.59,W*.055*kick,H*.06*kick,'#ffffff38');rect(W*.25,H*.86,W*.21,H*.25,'#e3bba8');rect(W*.54,H*.86,W*.21,H*.25,'#e3bba8');label('누운 상태 · 배를 바라보는 시점',W/2,H*.14)}else if(pitch>.23){oval(W/2,H*.95,W*.27,H*.26,colors[outfit]);oval(W/2,H*.79,W*.23,H*.20,colors[outfit]);rect(W*.34,H*.93,W*.13,H*.22,'#4d5265');rect(W*.53,H*.93,W*.13,H*.22,'#4d5265')}}function render(t){if(!started)return;let dt=Math.min(.05,(t-last)/1000||0);last=t;if(!lying){let speed=2*dt;let dx=(Math.cos(yaw)*joy.x+Math.sin(yaw)*-joy.y)*speed,dz=(Math.sin(yaw)*joy.x-Math.cos(yaw)*-joy.y)*speed;x=Math.max(-5.3,Math.min(5.3,x+dx));z=Math.max(-4.4,Math.min(4.4,z+dz))}kick=Math.pow(Math.max(0,Math.sin(t/900)),18);room();body();near=null;if(!lying){let best=2.2;for(const o of objects){let d=Math.hypot(o.x-x,o.z-z);if(d<best){best=d;near=o}}} $('interact').textContent=near?near.name+' 사용':'가까이 이동';$('status').textContent=`임신 ${week}주 · ${weight.toFixed(1)}kg · ${names[outfit]}`;requestAnimationFrame(render)}function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}function modal(title,options){$('mt').textContent=title;$('mb').replaceChildren();options.forEach(([name,fn])=>{let b=document.createElement('button');b.textContent=name;b.addEventListener('click',()=>{fn();$('modal').style.display='none'});$('mb').append(b)});$('modal').style.display='flex'}$('start').addEventListener('click',()=>{started=true;$('intro').style.display='none';$('hud').style.display='block';$('actions').style.display='flex';$('move').style.display='block';requestAnimationFrame(render)});$('close').onclick=()=>$('modal').style.display='none';$('look').onclick=()=>{pitch=pitch>.25?0:.65;toast(pitch?'아래를 바라봅니다':'정면을 바라봅니다')};$('rest').onclick=()=>{lying=false;$('rest').style.display='none';toast('침대에서 일어났어요')};$('interact').onclick=()=>{if(!near){toast('물건 가까이 걸어가세요');return}switch(near.type){case 'bed':lying=true;$('rest').style.display='block';toast('침대에 누웠어요 · 태동을 느껴보세요');break;case 'hanger':modal('옷 갈아입기',names.map((n,i)=>[n,()=>{outfit=i;toast(n+'으로 갈아입었어요')} ]));break;case 'mirror':modal('거울', [['전신 확인',()=>toast('거울 속 내 모습과 옷을 확인했어요')],['임신 주수 +1주',()=>{week=Math.min(40,week+1);weight+=.2;toast('임신 '+week+'주')}]]);break;case 'scale':toast('현재 체중 '+weight.toFixed(1)+'kg');break;case 'toilet':modal('화장실',[['입덧으로 구토하기',()=>toast('속이 좋지 않아 잠시 쉬었어요')],['괜찮아요',()=>{}]]);break;case 'food':modal('식사',[['밥 먹기',()=>toast('식사를 마쳤어요')],['음식 거부하기',()=>toast('입맛이 없어 식사를 거부했어요')]]);break;case 'person':modal('배우자와 대화',[['오늘 몸이 좀 힘들어',()=>toast('배우자: 그럼 오늘은 푹 쉬자.')],['태동 느껴볼래?',()=>toast('배우자: 와, 정말 움직이네!')]]);break}};const move=$('move'),knob=$('knob');function updateJoy(e){let r=move.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/(r.width*.36),dy=(e.clientY-r.top-r.height/2)/(r.height*.36),m=Math.max(1,Math.hypot(dx,dy));joy.x=dx/m;joy.y=dy/m;knob.style.transform=`translate(${joy.x*36}px,${joy.y*36}px)`}move.addEventListener('pointerdown',e=>{moveId=e.pointerId;move.setPointerCapture(e.pointerId);updateJoy(e)});move.addEventListener('pointermove',e=>{if(e.pointerId===moveId)updateJoy(e)});function reset(e){if(e.pointerId===moveId){moveId=null;joy.x=joy.y=0;knob.style.transform=''}}move.addEventListener('pointerup',reset);move.addEventListener('pointercancel',reset);canvas.addEventListener('pointerdown',e=>{pointer={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId||lying)return;let dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;yaw+=dx*.006;pitch=Math.max(-.6,Math.min(.9,pitch+dy*.004));pointer.x=e.clientX;pointer.y=e.clientY});canvas.addEventListener('pointerup',()=>pointer=null);canvas.addEventListener('pointercancel',()=>pointer=null);})();
</script></body></html>
